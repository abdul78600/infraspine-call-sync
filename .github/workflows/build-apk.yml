name: Build APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Generate Gradle wrapper (jar may be absent in source)
        run: gradle wrapper --gradle-version 8.7

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        env:
          GIT_COMMIT_SHA: ${{ github.sha }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: InfraSpine-Call-Sync-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish/update "latest" release with the APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (${{ github.sha }})
          body: |
            Automatically published from commit ${{ github.sha }} on ${{ github.ref_name }}.
            This is a debug build for internal/agent installs — not a Play Store release.

            Download `app-debug.apk` below and install it on your device
            (allow "Install unknown apps" when prompted).
          prerelease: true
          make_latest: true
          files: app/build/outputs/apk/debug/app-debug.apk
